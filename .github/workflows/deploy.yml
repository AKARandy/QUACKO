name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - name: Install Tesseract 5
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install deps
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - name: Start SUT
        run: |
          nohup .venv/bin/python app/main.py > sut.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5000/health && break || sleep 2; done
      - name: API + Model tests
        run: .venv/bin/python -m pytest tests/api tests/model -v --html=report/api-model.html --self-contained-html --junitxml=report/junit-api-model.xml
      - name: UI tests (chromium headless)
        working-directory: tests/ui
        run: npm ci && npx playwright install --with-deps chromium && npx playwright test --junit=../../report/junit-ui.xml
      - name: Log pass rates (real junit only)
        if: always()
        run: .venv/bin/python scripts/log_run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            report/
            tests/ui/playwright-report/
            data/baselines/
  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: test-reports
      - name: Install site deps
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - name: Assemble site assets (real reports + real failures only)
        run: |
          mkdir -p docs/reports docs/assets/failures
          if [ -f report/api-model.html ]; then cp report/api-model.html docs/reports/api-model.html; fi
          if [ -d tests/ui/playwright-report ]; then cp -r tests/ui/playwright-report docs/reports/ui-report; fi
          .venv/bin/python scripts/gen_gallery.py
      - name: Build site
        run: .venv/bin/mkdocs build --site-dir _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
